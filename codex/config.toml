model_reasoning_effort = "medium"
hide_agent_reasoning = true
personality = "pragmatic"
web_search = "live"
model = "gpt-5.5"
sandbox_mode = "workspace-write"

[approval_policy.granular]
rules = true
sandbox_approval = false
mcp_elicitations = false
request_permissions = false
skill_approval = false

[sandbox_workspace_write]
network_access = true

[mcp_servers.playwright]
command = "npx"
args = [ "@playwright/mcp@latest" ]

[mcp_servers.playwright.tools.browser_run_code]
approval_mode = "approve"

[mcp_servers.playwright.tools.browser_resize]
approval_mode = "approve"

[mcp_servers.playwright.tools.browser_navigate]
approval_mode = "approve"

[mcp_servers.playwright.tools.browser_hover]
approval_mode = "approve"

[mcp_servers.playwright.tools.browser_evaluate]
approval_mode = "approve"

[mcp_servers.playwright.tools.browser_click]
approval_mode = "approve"

[mcp_servers.playwright.tools.browser_navigate_back]
approval_mode = "approve"

[mcp_servers.playwright.tools.browser_tabs]
approval_mode = "approve"

[mcp_servers.playwright.tools.browser_close]
approval_mode = "approve"

[mcp_servers.figma]
url = "https://mcp.figma.com/mcp"

[mcp_servers.pencil]
command = "/Applications/Pencil.app/Contents/Resources/app.asar.unpacked/out/mcp-server-darwin-arm64"
args = [ "--app", "desktop" ]

[features]
multi_agent = true

[plugins."github@openai-curated"]
enabled = true

[plugins."browser-use@openai-bundled"]
enabled = true

[plugins."frontend-design@claude-plugins-official"]
enabled = true

[plugins."codex@openai-codex"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[tui]
status_line = ["model-with-reasoning", "context-used", "five-hour-limit", "project-name", "run-state", "used-tokens", "task-progress"]
theme = "catppuccin-latte"

[tui.model_availability_nux]
"gpt-5.5" = 4

[model_providers.opencode_bridge]
name = "OpenCode Bridge"
base_url = "http://127.0.0.1:4000/v1"
wire_api = "responses"
request_max_retries = 2
stream_max_retries = 2
stream_idle_timeout_ms = 300000

[model_providers.opencode_bridge.auth]
command = "echo"
args = ["sk-local-codex-bridge"]
timeout_ms = 1000

[profiles.oss_native]
model_provider = "opencode_bridge"
web_search = "disabled"

[profiles.oss_native.features]
apps = false

